name: AUR Builder

on:
  schedule:
    - cron: '47 */3 * * *'
  push:
    paths:
      - packages.txt
      - local-packages/**
      - custom-patches/**
  workflow_dispatch:
    inputs:
      packages:
        description: 'Build only these packages (space separated). Leave empty to build all changed packages.'
        required: false
        default: ''

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: aur-builder
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
      options: --privileged
    steps:
      - name: Tidy up
        run: |
          set -x
          rm -r /__t/* &
          df -h

      - name: Install git
        run: pacman -Syu --noconfirm git

      - name: Checkout
        uses: actions/checkout@v6

      - name: Checkout repo-data branch
        uses: actions/checkout@v6
        with:
          ref: repo-data
          path: repo-data

      - uses: actions/cache@v5
        with:
          path: |
            /var/cache/pacman/pkg
            /build/repo
          # use repo-data branch?
          key: cache-v2-${{ hashFiles('repo-data/lock.json') }}
          restore-keys: cache-v2-

      - name: Install build tools
        run: |
          set -x
          pacman-key --init
          pacman-key --recv-key 3056513887B78AEB --keyserver keyserver.ubuntu.com
          pacman-key --lsign-key 3056513887B78AEB
          pacman --noconfirm -U "https://cdn-mirror.chaotic.cx/chaotic-aur/chaotic-keyring.pkg.tar.zst" \
                 "https://cdn-mirror.chaotic.cx/chaotic-aur/chaotic-mirrorlist.pkg.tar.zst"
          echo -e "[chaotic-aur]\nInclude = /etc/pacman.d/chaotic-mirrorlist" >> /etc/pacman.conf

          pacman-key --recv-key b465fd29d2ea44cc --keyserver keyserver.ubuntu.com
          pacman-key --lsign-key b465fd29d2ea44cc
          pacman -Syu --noconfirm base-devel python jq devtools docker github-cli pyalpm

      - name: Local setup
        run: |
          git config --global --add safe.directory .

      - name: Fetch repo-data files
        run: |
          set -x
          cd repo-data
          if [ ! -f lock.json ]; then
            echo '{"version":1,"packages":[],"build_order":[]}' > lock.json
          fi
          if [ ! -f mapping.json ]; then
            echo '{"packages":{}}' > mapping.json
          fi
          mkdir -p repo/auto-aur/x86_64/
          if [ ! -f repo/auto-aur/x86_64/auto-aur.db.tar.gz ]; then
            repo-add repo/auto-aur/x86_64/auto-aur.db.tar.gz
          fi

      - name: Prepare dispatch package filter
        run: |
          printf '%s\n' "${{ github.event.inputs.packages }}" | tr ' ' '\n' | sed '/^$/d' > dispatch_packages.txt
          cat dispatch_packages.txt

      - name: Update lock.json if packages.txt or local-patches changed
        run: |
          python scripts/update_lock.py packages.txt repo-data/lock.json dispatch_packages.txt
          # 循環依存があればここでエラー終了

      - name: Check for missing AUR packages
        id: missing
        run: |
          if [ -s missing_packages.txt ]; then
            echo "has_missing=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_missing=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Mount host
        run: |
          set -x
          mount /dev/root /mnt
          mkdir -p /mnt/build /build
          mount --bind /mnt/build /build
          mkdir /build/pacman-cache
          mount --bind /var/cache/pacman /build/pacman-cache

      - name: Initialize local repo
        run: |
          set -x
          mkdir -p /build/repo
          if [ ! -f /build/repo/auto-aur-local.db.tar.gz ]; then
            repo-add /build/repo/auto-aur-local.db.tar.gz
          fi

      - name: Expand update list (include dependents)
        id: check
        run: |
          set -x
          cat repo-data/lock.json
          cat repo-data/mapping.json
          python scripts/expand_updates.py repo-data/lock.json repo-data/mapping.json final_build_list.txt dispatch_packages.txt
          cat final_build_list.txt
          if [ -s final_build_list.txt ]; then
            echo "is_empty=false" >> "$GITHUB_OUTPUT"
          else
            echo "is_empty=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build build.Dockerfile
        if: steps.check.outputs.is_empty == 'false'
        run: docker build -t aur-builder -f scripts/build.Dockerfile .

      - name: Build packages in order
        id: build
        if: steps.check.outputs.is_empty == 'false'
        run: |
          set -x
          shopt -s nullglob

          jq -r '.build_order[]' repo-data/lock.json > build_order.txt

          grep -xFf final_build_list.txt build_order.txt > sorted_build_list.txt
          while read pkg; do
            jq -r --arg pkg "$pkg" '.packages[] | select(.name==$pkg) | .pkgbase' repo-data/lock.json
          done < sorted_build_list.txt | awk '!seen[$0]++' > sorted_build_list_pkgbase.txt

          FAILED_PKGS=""
          while read pkgbase; do
            echo "::group::$pkgbase"
            echo "Building $pkgbase"

            BASE_DIR="/build/$pkgbase"

            if (
              set -e
              SRC_DIR="$BASE_DIR/src"
              mkdir -p "$SRC_DIR"

              if [ -d "local-packages/$pkgbase" ]; then
                cp -r "local-packages/$pkgbase/." "$SRC_DIR"
              elif [ -d "custom-patches/$pkgbase" ]; then
                cp -r "custom-patches/$pkgbase/." "$SRC_DIR"
              else
                git clone --depth=1 "https://aur.archlinux.org/$pkgbase.git" "$SRC_DIR"
              fi

              DEPS_FILE="$BASE_DIR/deps"
              if [ -f "deps/$pkgbase" ]; then
                cp "deps/$pkgbase" "$DEPS_FILE"
              else
                touch "$DEPS_FILE"
              fi

              docker run --rm \
                -v /build/repo:/repo \
                -v /build/pacman-cache:/var/cache/pacman \
                -v "$BASE_DIR":/home/builder/pkg \
                aur-builder
            ); then
              pkg_files=(/build/repo/*.pkg.tar.zst)
              if [ ${#pkg_files[@]} -gt 0 ]; then
                repo-add /build/repo/auto-aur-local.db.tar.gz "${pkg_files[@]}"
              fi
            else
              echo "::warning::$pkgbase failed"
              FAILED_PKGS="$FAILED_PKGS $pkgbase"
            fi

            rm -rf "$BASE_DIR"
            echo "::endgroup::"
          done < sorted_build_list_pkgbase.txt

          if [ -n "$FAILED_PKGS" ]; then
            echo "failed=true" >> "$GITHUB_OUTPUT"
            echo "failed_pkgs=$FAILED_PKGS" >> "$GITHUB_OUTPUT"
            echo "Some packages failed: $FAILED_PKGS" >&2
          else
            echo "failed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Import GPG key and sign packages
        if: steps.check.outputs.is_empty == 'false'
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -x
          shopt -s nullglob
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          # gpg.conf の設定 (パスフレーズを自動入力)
          mkdir -p $HOME/.gnupg
          cat >> $HOME/.gnupg/gpg.conf << EOF
          passphrase $GPG_PASSPHRASE
          pinentry-mode loopback
          no-tty
          EOF
          chmod 600 $HOME/.gnupg/gpg.conf
          # 鍵IDを取得
          KEY_ID=$(gpg --list-secret-keys --with-colons | grep '^sec:' | head -1 | cut -d: -f5)
          echo "KEY_ID=$KEY_ID" >> $GITHUB_ENV
          # 全パッケージに署名
          for pkg in /build/repo/*.pkg.tar.zst; do
            gpg --batch --detach-sign --local-user "$KEY_ID" "$pkg"
          done

      - name: Create GitHub Release
        if: steps.check.outputs.is_empty == 'false'
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -x
          shopt -s nullglob
          pkg_files=(/build/repo/*.pkg.tar.zst)
          sig_files=(/build/repo/*.pkg.tar.zst.sig)

          if [ ${#pkg_files[@]} -eq 0 ]; then
            echo "No packages to release."
            echo "tag=" >> $GITHUB_OUTPUT
            exit 0
          fi

          TAG="build-$(date -u +'%Y%m%d-%H%M%S')"
          assets=("${pkg_files[@]}")
          for sig in "${sig_files[@]}"; do
            assets+=("$sig")
          done

          gh release create "$TAG" --title "Build $TAG" --notes "Updated packages" "${assets[@]}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Push repo-data changes
        if: steps.check.outputs.is_empty == 'false' || steps.missing.outputs.has_missing == 'true'
        run: |
          set -x
          cd repo-data
          python ../scripts/update_repo_data.py \
            --mapping mapping.json \
            --new-packages /build/repo \
            --release-tag ${{ steps.release.outputs.tag }} \
            --db-output repo/auto-aur/x86_64/auto-aur.db.tar.gz \
            --redirects _redirects \
            --gpg-key "${{ env.KEY_ID }}" \
            --remove-packages ../missing_packages.txt
          cp ../scripts/index.html .
          cp ../scripts/404.html .
          pushd repo/auto-aur/x86_64/
          ln -sf auto-aur.db.tar.gz.sig auto-aur.db.sig
          ln -sf auto-aur.files.tar.gz.sig auto-aur.files.sig
          popd
          find -type f
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Update repo-data" || echo "No changes"
          git push origin repo-data

      - name: Fail if package builds failed
        if: steps.build.outputs.failed == 'true'
        run: |
          echo "Failed packages:${{ steps.build.outputs.failed_pkgs }}"
          exit 1

      - name: Fail if AUR packages are missing
        if: steps.missing.outputs.has_missing == 'true'
        run: |
          echo "These packages were not found in AUR and have been removed from the repository:"
          cat missing_packages.txt
          echo "Please remove them from packages.txt or replace them with alternatives."
          exit 1